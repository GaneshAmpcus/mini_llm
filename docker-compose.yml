  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-mini_llm}:${POSTGRES_PASSWORD:-mini_llm_dev}@postgres:5432/${POSTGRES_DB:-mini_llm}

    volumes:
      - .:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    restart: unless-stopped

    
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_llm}
      POSTGRES_USER: ${POSTGRES_USER:-mini_llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_llm_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_llm} -d ${POSTGRES_DB:-mini_llm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: